            display: flex;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

            position: relative;

        .carousel-slide img {

            height: 100%;
            object-fit: cover;
        }

            border-radius: 50%;

            justify-content: center;
