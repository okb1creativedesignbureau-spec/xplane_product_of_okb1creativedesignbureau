            --text-primary: #f8fafc;

        .nav-back a {
            color: var(--accent-color);

            font-weight: 600;

            display: grid;
            gap: 2rem;
            margin-bottom: 4rem;
        }

            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .product-card:hover {
            border-color: rgba(14, 165, 233, 0.4);
        }
