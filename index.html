    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        header p.subtitle {
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
        }

        header p.bio {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 700px;
            margin: 0 auto;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .section-heading {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--accent-color);
            padding-left: 0.75rem;
            letter-spacing: 0.5px;
        }

        .product-grid {
            display: grid;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .product-card:hover {
            border-color: rgba(14, 165, 233, 0.4);
        }

        /* Drag & Drop / Carousel Preview Zone */
        .preview-dropzone {
            width: 100%;
            height: 260px;
            background-color: #080c14;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .carousel-track {
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.3s ease-in-out;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }

        .carousel-slide img, .preview-dropzone > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(11, 15, 25, 0.75);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            z-index: 5;
            transition: background 0.2s, border-color 0.2s;
        }

        .carousel-nav-btn:hover {
            background: var(--accent-color);
            color: #0b0f19;
            border-color: var(--accent-color);
        }

        .carousel-nav-btn.prev { left: 10px; }
        .carousel-nav-btn.next { right: 10px; }

        .carousel-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(11, 15, 25, 0.85);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 5;
        }
