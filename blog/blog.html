<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Blog | OKB-1 Creative Design Bureau</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Yellow Unmarked Admin Trigger Button */
        .btn-admin {
            background-color: #f59e0b;
            color: #0b0f19;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-admin:hover {
            opacity: 0.9;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p.subtitle {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Hidden Editor Modal */
        .editor-modal {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .editor-modal h3 {
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 6px;
            font-family: inherit;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        /* Image Insert Dropzone inside Editor */
        .editor-dropzone {
            border: 2px dashed rgba(14, 165, 233, 0.4);
            background-color: #080c14;
            padding: 1.25rem;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease;
        }

        .editor-dropzone:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0b0f19;
            font-weight: 700;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* Medium-Style Newsletter Feed Cards */
        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .blog-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.75rem 2rem;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .blog-card:hover {
            border-color: rgba(14, 165, 233, 0.4);
            transform: translateY(-2px);
        }

        .post-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .post-title {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .post-snippet {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .read-more-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .read-more-btn:hover {
            background-color: var(--accent-color);
            color: #0b0f19;
        }

        /* Full Post Reader View */
        #readerView {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 3rem 2.5rem;
        }

        #readerTitle {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        #readerMeta {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        #readerBody {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        #readerBody p {
            margin-bottom: 1.25rem;
        }

        #readerBody img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1.5rem 0;
            border: 1px solid var(--border-color);
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="../index.html" class="back-link" id="navBack">&larr; Back to Hangar</a>
        <!-- Yellow Unmarked Admin Trigger Button -->
        <button class="btn-admin" onclick="toggleEditor()">+ New Blog Post</button>
    </div>

    <!-- Admin Publisher Box -->
    <div id="editorModal" class="editor-modal">
        <h3>Publish New Blog Entry</h3>
        <div class="form-group">
            <label>Post Title</label>
            <input type="text" id="postTitle" class="form-control" placeholder="e.g., Reconstructing Berlin Tempelhof...">
        </div>
        <div class="form-group">
            <label>Category / Tag</label>
            <input type="text" id="postCategory" class="form-control" placeholder="e.g., GIS & Scenery">
        </div>
        
        <!-- Image Drag & Drop / Upload Helper -->
        <div class="form-group">
            <label>Insert Image into Post</label>
            <div class="editor-dropzone" ondragover="event.preventDefault()" ondrop="handleImageDrop(event)" onclick="document.getElementById('imageFilePicker').click()">
                📷 <strong>Drop screenshot/image here</strong> or click to upload<br>
                <span style="font-size: 0.75rem; color: var(--accent-color);">Image will be automatically converted and embedded into your content</span>
            </div>
            <input type="file" id="imageFilePicker" accept="image/*" style="display: none;" onchange="handleImagePick(this)">
        </div>

        <div class="form-group">
            <label>Full Content (HTML supported)</label>
            <textarea id="postContent" class="form-control" placeholder="Write your full article content here... use <p> tags for paragraphs."></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" onclick="publishPost()">Publish Live</button>
            <button class="btn btn-secondary" onclick="toggleEditor()">Cancel</button>
        </div>
    </div>

    <header id="pageHeader">
        <p class="subtitle">OKB-1 Creative Design Bureau</p>
        <h1>Engineering & Research Log</h1>
    </header>

    <main>
        <!-- Feed List View -->
        <div id="feedView">
            <div id="blog-container" class="blog-list">
                <p style="color: var(--text-secondary); text-align: center;">Loading log entries...</p>
            </div>
        </div>

        <!-- Full Article Reader View -->
        <div id="readerView">
            <div id="readerMeta"></div>
            <h1 id="readerTitle"></h1>
            <div id="readerBody"></div>
            <br>
            <button class="btn btn-secondary" onclick="closeReader()">&larr; Back to all posts</button>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="copyright-year"></span> OKB-1 Creative Design Bureau. All rights reserved.</p>
    </footer>
</div>

<script>
    document.getElementById('copyright-year').textContent = new Date().getFullYear();

    const defaultPosts = [
        {
            title: "Reconstructing Berlin Tempelhof in 1:500 Scale",
            date: "November 4, 2026",
            category: "GIS & Scenery",
            content: "<p>Using survey layers from GeoBasis Brandenburg (2019–2021), we mapped historical orthophoto rasters to match precise architectural blueprints...</p><p>Every NURBS surface loft was optimized for X-Plane 12 rendering pipelines without sacrificing geometric fidelity, ensuring seamless runway integration and authentic lighting layouts.</p>"
        }
    ];

    function getStoredPosts() {
        const stored = localStorage.getItem('okb1_blog_posts');
        if (!stored) {
            localStorage.setItem('okb1_blog_posts', JSON.stringify(defaultPosts));
            return defaultPosts;
        }
        return JSON.parse(stored);
    }

    function renderPosts() {
        const container = document.getElementById('blog-container');
        const posts = getStoredPosts();
        
        container.innerHTML = '';
        if (posts.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">No blog posts available.</p>';
            return;
        }

        posts.forEach((post, index) => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = post.content;
            const snippetText = tempDiv.textContent.slice(0, 140) + '...';

            const card = document.createElement('div');
            card.className = 'blog-card';
            card.innerHTML = `
                <div class="post-meta">📅 ${post.date} &bull; <span style="color: var(--accent-color);">${post.category || 'Engineering'}</span></div>
                <h2 class="post-title">${post.title}</h2>
                <div class="post-snippet">${snippetText}</div>
                <button class="read-more-btn" onclick="openPost(${index})">Read More &rarr;</button>
            `;
            container.appendChild(card);
        });
    }

    function insertImageTag(base64Data) {
        const textarea = document.getElementById('postContent');
        const imgTag = `<img src="${base64Data}" alt="Blog Image">`;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        
        textarea.value = textarea.value.substring(0, start) + imgTag + textarea.value.substring(end);
        textarea.focus();
    }

    function handleImageDrop(ev) {
        ev.preventDefault();
        if (ev.dataTransfer.files && ev.dataTransfer.files[0]) {
            processImageFile(ev.dataTransfer.files[0]);
        }
    }

    function handleImagePick(input) {
        if (input.files && input.files[0]) {
            processImageFile(input.files[0]);
        }
    }

    function processImageFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            insertImageTag(e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function openPost(index) {
        const posts = getStoredPosts();
        const post = posts[index];

        document.getElementById('readerTitle').textContent = post.title;
        document.getElementById('readerMeta').innerHTML = `📅 ${post.date} &bull; <span>${post.category || 'Engineering'}</span>`;
        document.getElementById('readerBody').innerHTML = post.content;

        document.getElementById('feedView').style.display = 'none';
        document.getElementById('pageHeader').style.display = 'none';
        document.getElementById('readerView').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function closeReader() {
        document.getElementById('readerView').style.display = 'none';
        document.getElementById('feedView').style.display = 'block';
        document.getElementById('pageHeader').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function toggleEditor() {
        const modal = document.getElementById('editorModal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function publishPost() {
        const title = document.getElementById('postTitle').value.trim();
        const category = document.getElementById('postCategory').value.trim() || 'Engineering';
        const content = document.getElementById('postContent').value.trim();

        if (!title || !content) {
            alert('Please fill out both the title and content fields.');
            return;
        }

        const newPost = {
            title,
            category,
            content: content.startsWith('<p>') ? content : `<p>${content}</p>`,
            date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        };

        const posts = getStoredPosts();
        posts.unshift(newPost);
        localStorage.setItem('okb1_blog_posts', JSON.stringify(posts));

        document.getElementById('postTitle').value = '';
        document.getElementById('postCategory').value = '';
        document.getElementById('postContent').value = '';
        toggleEditor();
        renderPosts();
    }

    renderPosts();
</script>

</body>
</html>
