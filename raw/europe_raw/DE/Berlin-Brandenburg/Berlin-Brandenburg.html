<script type="module">
    async function loadCarousel(prefix, modulePath) {
        const track = document.getElementById(`${prefix}-track`);
        const fallbackText = document.getElementById(`${prefix}-text`);
        const prevBtn = document.getElementById(`${prefix}-prev`);
        const nextBtn = document.getElementById(`${prefix}-next`);
        const counter = document.getElementById(`${prefix}-counter`);

        if (!track) return;

        try {
            const mod = await import(modulePath);
            const imageData = mod.image_container;

            if (!imageData || imageData.length === 0) return;

            track.innerHTML = '';
            if (fallbackText) fallbackText.style.display = 'none';

            imageData.forEach((item, idx) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name || `${prefix.toUpperCase()} Asset ${idx + 1}`;
                slide.appendChild(img);
                track.appendChild(slide);
            });

            let currentIdx = 0;
            const total = imageData.length;

            const update = () => {
                track.style.transform = `translateX(-${currentIdx * 100}%)`;
                if (counter) counter.textContent = `${currentIdx + 1} / ${total}`;
            };

            if (total > 1 && prevBtn && nextBtn) {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
                if (counter) counter.style.display = 'block';

                prevBtn.onclick = () => {
                    currentIdx = (currentIdx === 0) ? total - 1 : currentIdx - 1;
                    update();
                };

                nextBtn.onclick = () => {
                    currentIdx = (currentIdx === total - 1) ? 0 : currentIdx + 1;
                    update();
                };
            }

            update();
        } catch (err) {
            console.warn(`Could not load module ${modulePath}:`, err);
        }
    }

    // Load each carousel independently so a missing .js file never breaks the others
    loadCarousel('staaken28', './DE-0449_1928.js');
    loadCarousel('adlershof28', './DE-0013_1928.js');
    loadCarousel('adlershof53', './DE-0013_1953.js');
    loadCarousel('staaken53', './DE-0449_1953.js');
    loadCarousel('schonwalde53', './DE-0012_1953.js');
    loadCarousel('gatow53', './EDBG_1953.js');
    loadCarousel('templin09', './DE-0879_2009.js');
    loadCarousel('finow09', './EDAV_2009.js');
    loadCarousel('sxf09', './EDDB_2009.js');
    loadCarousel('txl04', './EDDT_2004.js');
    loadCarousel('thf04', './EDDI_2004.js');
</script>
