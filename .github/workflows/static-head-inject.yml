name: Inject Root Favicons & SEO Loader on Build


on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Inject Absolute Head Tags into All HTML Files
        run: |
          python3 -c "
          import os, re

          # Absolute head block injected at build time
          HEAD_TAGS = '''<head>
              <link rel=\"icon\" type=\"image/png\" sizes=\"48x48\" href=\"/xplane_product_of_okb1creativedesignbureau/favicon.png\">
              <link rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"/xplane_product_of_okb1creativedesignbureau/favicon.png\">
              <link rel=\"apple-touch-icon\" href=\"/xplane_product_of_okb1creativedesignbureau/favicon.png\">
              <script type=\"module\" src=\"/xplane_product_of_okb1creativedesignbureau/seo-config.js\"></script>'''

          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.html'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      # Remove any old relative script tags
                      content = re.sub(r'<script[^>]*seo-config\.js[^>]*></script>', '', content)
                      
                      # Replace <head> with absolute root tags
                      if '<head>' in content:
                          content = content.replace('<head>', HEAD_TAGS, 1)
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f'Injected: {path}')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
